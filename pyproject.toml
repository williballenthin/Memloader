[project]
name = "memloader"
version = "1.1.0"
description = "Load binaries into IDA from ZIP archives or URLs without writing them to disk"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "idapro",
    "ruff",
    "mypy",
    "ida-settings>=3.5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs", "MemoryLoader"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["memloader", "conftest", "idahelpers", "pe", "zipcrypto"]
